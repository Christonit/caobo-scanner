# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
project_id = "caobo-recibos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Default redirect target when redirectTo is omitted. For hosted projects,
# set Site URL to your production origin in Authentication → URL Configuration,
# and keep localhost in Additional Redirect URLs so local + deploy both work.
# Example production allowlist entries:
#   https://caobo-automationz-ui-production.up.railway.app
#   https://caobo-automationz-ui-production.up.railway.app/auth/callback
#   https://caobo-automationz-ui-production.up.railway.app/auth/reset-password
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/reset-password",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Also governs invite / magic-link / recovery link lifetime (default 1h).
# Mirror this value in SUPABASE_INVITE_EXPIRY_SECONDS so the Equipo UI
# marks invitations as expired at the same time Auth rejects the link.
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
